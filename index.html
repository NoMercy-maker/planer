  clear() {

  },

  },
  exp() {
    const a = document.createElement("a");

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-a]");

});
$("#impf").onchange = (e) => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f) return;
  f.text().then((t) => {
    const d = JSON.parse(t);
    if (!Array.isArray(d.recipes)) throw 0;
    if (!confirm("\u0417\u0430\u043C\u0456\u043D\u0438\u0442\u0438 \u043F\u043E\u0442\u043E\u0447\u043D\u0456 \u0440\u0435\u0446\u0435\u043F\u0442\u0438 \u0439 \u043C\u0435\u043D\u044E \u0434\u0430\u043D\u0438\u043C\u0438 \u0437 \u0444\u0430\u0439\u043B\u0443?")) return;
    S = { ...d, pins: d.pins || [], plan: d.plan || {}, checked: d.checked || {}, ph: 1 };

  }).catch(() => toast("\u041D\u0435 \u0432\u0434\u0430\u043B\u043E\u0441\u044F \u043F\u0440\u043E\u0447\u0438\u0442\u0430\u0442\u0438 \u0444\u0430\u0439\u043B \u043A\u043E\u043F\u0456\u0457."));
};
const AW = 148;
function setOpen(id) {
  openId = id;
  document.querySelectorAll(".rw").forEach((li) => {
    const f = li.querySelector(".rf");
    f.classList.remove("swh");
    f.style.transition = "transform .3s cubic-bezier(.22,1,.36,1)";
    f.style.transform = `translateX(${li.dataset.id === id ? -AW : 0}px)`;
  });
}
function bindRows() {
  document.querySelectorAll(".rw").forEach((li) => {
    const f = li.querySelector(".rf"), id = li.dataset.id;
    let g = null, off = 0;
    const rest = () => openId === id ? -AW : 0;
    if (f.classList.contains("swh")) {
      S.hint = 1;
      persist();
      f.onanimationend = () => f.classList.remove("swh");
    }
    f.onpointerdown = (e) => {
      g = { x: e.clientX, y: e.clientY, b: rest(), h: null };
      off = rest();
    };
    f.onpointermove = (e) => {
      if (!g) return;
      const dx = e.clientX - g.x, dy = e.clientY - g.y;
      if (g.h === null) {
        if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
        g.h = Math.abs(dx) > Math.abs(dy);
        if (g.h) {
          try {
            f.setPointerCapture(e.pointerId);
          } catch (x) {
          }
        }
      }
      if (!g.h) return;
      f.classList.remove("swh");
      off = Math.min(0, Math.max(-AW - 24, g.b + dx));
      f.style.transition = "none";
      f.style.transform = `translateX(${off}px)`;
    };
    f.onpointerup = () => {
      const q = g;
      g = null;
      if (!q) return;
      if (q.h) setOpen(off < -AW / 2 ? id : null);
      else if (q.h === null) {
        if (openId === id || openId) setOpen(null);
        else openDetail(id);
      }
    };
    f.onpointercancel = () => {
      if (g && g.h) setOpen(openId);
      g = null;
    };
    f.onkeydown = (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        openDetail(id);
      }
    };
  });
}
const TABS = [["home", "\u0413\u043E\u043B\u043E\u0432\u043D\u0430", "house"], ["rec", "\u0420\u0435\u0446\u0435\u043F\u0442\u0438", "book"], ["week", "\u041C\u0435\u043D\u044E", "cal"], ["shop", "\u041F\u043E\u043A\u0443\u043F\u043A\u0438", "bag"]];
$("#nav").innerHTML = TABS.map(([k, l, i]) => `<button data-a="tab" data-k="${k}">${ic(i, 22)}<span>${l}</span></button>`).join("");
$("#fab").innerHTML = ic("plus", 24, 1.75);
function render() {
  $("#main").innerHTML = { home: vHome, rec: vRec, week: vWeek, shop: vShop }[tab]();
  document.querySelectorAll("#nav button").forEach((b) => {
    const on = b.dataset.k === tab;

  if (tab === "rec") bindRows();
}

});
