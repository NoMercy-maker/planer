<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Планер">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Кулінарний планер</title>
<style>
:root{--bg:#f4f6f1;--card:#fff;--ink:#1d2b24;--mut:#66756c;--line:#dce3da;--acc:#2f6b4f;--acc2:#e3a008;--danger:#b3372b}
@media(prefers-color-scheme:dark){:root{--bg:#141b17;--card:#1d2722;--ink:#e8efe9;--mut:#9aaba1;--line:#2c3a33;--acc:#5fb98c;--acc2:#f0b429;--danger:#e8776a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:18px 20px 0;max-width:1200px;margin:auto}
h1{font:700 26px Georgia,serif;margin:0 0 12px}
nav{display:flex;gap:4px;border-bottom:2px solid var(--line)}
nav button{background:none;border:0;padding:10px 16px;font:inherit;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
nav button.on{color:var(--acc);border-color:var(--acc);font-weight:600}
main{max-width:1200px;margin:auto;padding:16px 20px 40px}
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.del{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.sm{padding:4px 10px;font-size:13px}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar h2{margin:0;font:600 20px Georgia,serif;flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.rc{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.rc .ph{height:150px;background:var(--line);display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px;text-align:center}
.rc .ph img{width:100%;height:100%;object-fit:cover}
.rc .bd{padding:12px;flex:1}
.rc h3{margin:0 0 4px;font:600 17px Georgia,serif}
.tag{display:inline-block;font-size:12px;color:var(--acc);border:1px solid var(--acc);border-radius:20px;padding:0 8px}
.rc .ft{padding:0 12px 12px;display:flex;gap:6px}
.rc ul{margin:6px 0 0;padding-left:18px;color:var(--mut);font-size:13px}
.plan{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start}
.pool{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;position:sticky;top:8px;max-height:80vh;overflow:auto}
.pool h4{margin:0 0 8px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-bottom:6px;cursor:grab;font-size:14px}
.chip small{display:block;color:var(--mut)}
.tw{overflow-x:auto}
table.pl{border-collapse:separate;border-spacing:6px;min-width:760px;width:100%}
.pl th{font-weight:600;font-size:13px;color:var(--mut);text-align:left}
.pl th.r{width:90px;vertical-align:middle}
.cell{background:var(--card);border:1px dashed var(--line);border-radius:10px;height:78px;padding:6px;font-size:13px;position:relative}
.cell.over{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--card))}
.cell.full{border-style:solid}
.cell b{display:block;line-height:1.25;padding-right:16px}
.cell .x{position:absolute;top:2px;right:4px;background:none;border:0;color:var(--mut);cursor:pointer}
.cell select{border:0;background:transparent;color:var(--mut);padding:2px;font-size:12px;position:absolute;bottom:2px;left:4px;width:calc(100% - 8px)}
.shop h3{margin:18px 0 6px;font:600 17px Georgia,serif;border-bottom:1px solid var(--line);padding-bottom:4px}
.shop label{display:flex;gap:10px;padding:5px 0;cursor:pointer;align-items:center}
.shop input{width:auto}
.shop .q{margin-left:auto;color:var(--mut)}
.shop .done span{text-decoration:line-through;color:var(--mut)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:min(640px,94vw);padding:18px;max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{margin:0 0 10px;font:600 20px Georgia,serif}
.f{margin-bottom:10px}.f label{display:block;font-size:13px;color:var(--mut);margin-bottom:2px}
.row{display:grid;grid-template-columns:1fr 80px 90px 32px;gap:6px;margin-bottom:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.imgbox{border:1px solid var(--line);border-radius:10px;padding:10px}
.imgbox img{width:100%;max-height:220px;object-fit:cover;border-radius:8px;margin-top:8px}
.imgbox .pr{font-size:12px;color:var(--mut);margin-top:6px;word-break:break-word}
.empty{color:var(--mut);padding:30px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.hint{color:var(--mut);font-size:13px;margin:0 0 12px}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);-webkit-text-size-adjust:100%}
nav{overflow-x:auto;white-space:nowrap}
@media(max-width:760px){input,select,textarea{font-size:16px}.btn{padding:10px 14px}.row{grid-template-columns:1fr 70px 80px 36px}main{padding:12px}.rc .ph{height:190px}.cell select{font-size:14px}.plan{grid-template-columns:1fr}.pool{position:static;max-height:200px}.two{grid-template-columns:1fr}}
</style>
<script>window.onerror=function(m,u,l){var e=document.getElementById('main');if(e)e.innerHTML='<pre style="white-space:pre-wrap;padding:16px">Помилка: '+m+' (рядок '+l+')</pre>'}</script>
<style>dialog:not([open]){display:none}</style>
</head>
<body>
<header>
  <h1>Кулінарний планер</h1>
  <nav id="nav">
    <button data-t="recipes" class="on">Книга рецептів</button>
    <button data-t="plan">Меню на тиждень</button>
    <button data-t="shop">Список покупок</button>
    <button id="cfg" style="margin-left:auto">⚙ Копія даних</button>
  </nav>
</header>
<main id="main"><p style="padding:20px;color:#66756c">Завантаження… Якщо цей напис не зникає, скрипти не запускаються: відкрийте посилання в Safari.</p></main>
<div id="toast" style="display:none;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;z-index:9;max-width:90vw"></div>

<dialog id="dlg">
  <h3 id="dt">Новий рецепт</h3>
  <div class="two">
    <div class="f"><label>Назва</label><input id="fn"></div>
    <div class="f"><label>Категорія</label><select id="fc"></select></div>
  </div>
  <div class="f"><label>Інгредієнти</label><div id="ings"></div><button class="btn sec sm" id="addI" type="button">+ Інгредієнт</button></div>
  <div class="f"><label>Кроки приготування</label><textarea id="fs" rows="4"></textarea></div>
  <div class="imgbox">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <b style="flex:1">Фото страви</b>
      <select id="genSel" style="width:auto" title="Генератор зображень"><option value="horde">AI Horde — безкоштовно, 1–5 хв</option><option value="poll">Pollinations — швидко, але може вимагати оплату</option></select>
      <button class="btn sm" id="gen" type="button">Згенерувати фото</button>
      <button class="btn sec sm" id="upl" type="button">Завантажити своє</button><input type="file" id="file" accept="image/*" hidden>
      <button class="btn del sm" id="rmImg" type="button">Прибрати</button>
    </div>
    <textarea id="prompt" rows="2" style="margin-top:8px" placeholder="Що на фото? Напишіть англійською, напр.: creamy mushroom buckwheat in a bowl. Якщо порожньо — опис складеться з назви й інгредієнтів."></textarea>
    <div id="imgslot"></div>
  </div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
    <button class="btn sec" id="cancel" type="button">Скасувати</button>
    <button class="btn" id="save" type="button">Зберегти рецепт</button>
  </div>
</dialog>

<dialog id="cfgDlg">
  <h3>Резервна копія</h3>
  <p class="hint">Рецепти й меню зберігаються в цьому браузері. Щоб не втратити їх чи перенести на інший пристрій, збережіть копію у файл.</p>
  <div class="f">
    <button class="btn sec sm" id="exp" type="button">Зберегти у файл</button>
    <button class="btn sec sm" id="imp" type="button">Завантажити з файлу</button><input type="file" id="impf" accept=".json" hidden></div>
  <div style="display:flex;justify-content:flex-end"><button class="btn" id="cfgX" type="button">Закрити</button></div>
</dialog>

<script>document.querySelectorAll("dialog").forEach(function(d) {
  if (!d.showModal) {
    d.showModal = function() {
      this.setAttribute("open", "");
      this.style.cssText = "position:fixed;top:4vh;left:50%;transform:translateX(-50%);z-index:50;overflow:auto;display:block";
    };
    d.close = function() {
      this.removeAttribute("open");
      this.style.display = "none";
    };
  }
});
const MEALS = [["breakfast", "\u0421\u043D\u0456\u0434\u0430\u043D\u043E\u043A"], ["lunch", "\u041E\u0431\u0456\u0434"], ["dinner", "\u0412\u0435\u0447\u0435\u0440\u044F"], ["snack", "\u041F\u0435\u0440\u0435\u043A\u0443\u0441"]];

const CATS = [
  ["\u041E\u0432\u043E\u0447\u0456 \u0442\u0430 \u0444\u0440\u0443\u043A\u0442\u0438", "\u043A\u0430\u0440\u0442\u043E\u043F\u043B|\u043C\u043E\u0440\u043A\u043E\u0432|\u0446\u0438\u0431\u0443\u043B|\u0447\u0430\u0441\u043D\u0438\u043A|\u043F\u043E\u043C\u0456\u0434\u043E\u0440|\u0442\u043E\u043C\u0430\u0442|\u043E\u0433\u0456\u0440|\u043A\u0430\u043F\u0443\u0441\u0442|\u043F\u0435\u0440\u0435\u0446|\u043F\u0435\u0440\u0446|\u044F\u0431\u043B\u0443\u043A|\u0431\u0430\u043D\u0430\u043D|\u043B\u0438\u043C\u043E\u043D|\u0437\u0435\u043B\u0435\u043D\u044C|\u043F\u0435\u0442\u0440\u0443\u0448|\u043A\u0440\u0456\u043F|\u0441\u0430\u043B\u0430\u0442|\u0431\u0440\u043E\u043A\u043E\u043B\u0456|\u0433\u0440\u0438\u0431|\u0431\u0443\u0440\u044F\u043A|\u043A\u0430\u0431\u0430\u0447|\u0430\u0432\u043E\u043A\u0430\u0434\u043E|\u044F\u0433\u043E\u0434|\u0430\u043F\u0435\u043B\u044C\u0441\u0438\u043D"],

};
const ORDER = [...CATS.map((c) => c[0]), "\u0406\u043D\u0448\u0435"];
const $ = (s) => document.querySelector(s);

async function hordePhoto(p, onWait) {
  const H = { "Content-Type": "application/json", apikey: "0000000000", "Client-Agent": "culinary-planner:1:local" };

  const r = await fetch(base + "async", { method: "POST", headers: H, body: JSON.stringify({ prompt: p + " ### blurry, text, watermark, people, hands, cartoon, deformed, bad plating", params: { width: 512, height: 384, steps: 25, n: 1, cfg_scale: 7, sampler_name: "k_euler_a" }, nsfw: false, censor_nsfw: true, r2: false, slow_workers: true }) });

    await wait(4e3);

    done = !!c.done;
    if (!done && onWait) onWait(c.queue_position != null ? `\u0432 \u0447\u0435\u0440\u0437\u0456: ${c.queue_position}, ~${c.wait_time || "?"} \u0441` : "\u0433\u0435\u043D\u0435\u0440\u0443\u044E");
  }
  if (!done) throw new Error("AI Horde: \u0447\u0435\u0440\u0433\u0430 \u0437\u0430\u0434\u043E\u0432\u0433\u0430. \u0421\u043F\u0440\u043E\u0431\u0443\u0439\u0442\u0435 \u043F\u0456\u0437\u043D\u0456\u0448\u0435 \u0430\u0431\u043E \u043E\u0431\u0435\u0440\u0456\u0442\u044C Pollinations.");
  const st = await (await fetch(base + "status/" + j.id)).json();
  const g = st.generations && st.generations[0];
  if (!g || !g.img) throw new Error("AI Horde \u043D\u0435 \u043F\u043E\u0432\u0435\u0440\u043D\u0443\u0432 \u0437\u043E\u0431\u0440\u0430\u0436\u0435\u043D\u043D\u044F (\u043C\u043E\u0436\u043B\u0438\u0432\u043E, \u0437\u0430\u043F\u0438\u0442 \u0432\u0456\u0434\u0445\u0438\u043B\u0435\u043D\u043E \u0444\u0456\u043B\u044C\u0442\u0440\u043E\u043C).");
  let src;
  if (/^https?:/.test(g.img)) {
    const b = await (await fetch(g.img)).blob();
    src = await new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result);
      fr.onerror = rej;
      fr.readAsDataURL(b);
    });
  } else src = "data:image/webp;base64," + g.img;
  return await new Promise((res, rej) => shrink(src, res, rej));
}
async function getPhoto(p, onWait) {

    let r;
    try {
      r = await fetch(imgUrl(p));
    } catch (e) {
      return imgUrl(p, 1);
    }
    if (r.ok) {
      const b = await r.blob();
      return await new Promise((res, rej) => {
        const fr = new FileReader();

        fr.onerror = rej;
        fr.readAsDataURL(b);
      });
    }
    if (r.status === 401 || r.status === 402 || r.status === 403) {
      GEN = "horde";
      $("#genSel").value = GEN;
      try {
        localStorage.setItem("culinary-gen", GEN);
      } catch (e) {
      }
      if (onWait) onWait("Pollinations \u0432\u0438\u043C\u0430\u0433\u0430\u0454 \u043E\u043F\u043B\u0430\u0442\u0443 (\u043F\u043E\u043C\u0438\u043B\u043A\u0430 " + r.status + "), \u043F\u0435\u0440\u0435\u043C\u0438\u043A\u0430\u044E \u043D\u0430 AI Horde");
      await wait(2500);
      return hordePhoto(p, onWait);

    if (r.status === 429 || r.status >= 500) {
      if (onWait) onWait();
      await wait(16e3);
      continue;
    }
    throw new Error("\u0421\u0435\u0440\u0432\u0456\u0441 \u0444\u043E\u0442\u043E \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0432 \u043F\u043E\u043C\u0438\u043B\u043A\u043E\u044E " + r.status + ".");
  }
  throw new Error("\u0421\u0435\u0440\u0432\u0456\u0441 \u0444\u043E\u0442\u043E \u0437\u0430\u0440\u0430\u0437 \u043F\u0435\u0440\u0435\u0432\u0430\u043D\u0442\u0430\u0436\u0435\u043D\u0438\u0439. \u0421\u043F\u0440\u043E\u0431\u0443\u0439\u0442\u0435 \u0437\u0430 \u0445\u0432\u0438\u043B\u0438\u043D\u0443.");
}
